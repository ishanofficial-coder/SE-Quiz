      padding: 0.875rem 1.25rem;
      text-align: left;
      font-size: 0.975rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eef2ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect) !important;
      color: var(--incorrect) !important;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: var(--border);
      cursor: not-allowed;
    }

      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);

        options: ["A public method named drive that takes an integer speed parameter and returns nothing", "A private attribute of type int", "A composition relationship", "A black-box test case"],

      {

        options: ["In aggregation, child objects can exist independently; in composition, child objects cannot exist without the parent.", "Aggregation is used for databases; composition is used for HTML.", "Aggregation requires white-box testing; composition requires black-box testing.", "There is no difference; they are identical terms."],

      {

        options: ["Aggregation (Man has-a pet/son/daughter/wife, and they have independent life cycles)", "Composition (They cannot exist without the man)", "Generalization (They inherit man's attributes)", "Black-box testing"],
        answer: 0

    ];

    // Shuffle options dynamically and keep track of answer
    let questions = rawQuestions.map(item => {
      let opts = [...item.options];
      let correctText = opts[item.answer];
      // Fisher-Yates shuffle options
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      return {
        q: item.q,
        options: opts,
        answer: opts.indexOf(correctText)
      };
    });

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const questionCounterEl = document.getElementById("question-counter");
    const scoreCounterEl = document.getElementById("score-counter");
    const progressBarEl = document.getElementById("progress-bar");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
      answered = false;
      nextBtn.disabled = true;

      const qData = questions[currentQuestionIndex];
      questionTextEl.textContent = `${currentQuestionIndex + 1}. ${qData.q}`;
      
      questionCounterEl.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
      scoreCounterEl.textContent = `Score: ${score}`;
      
      const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
      progressBarEl.style.width = `${progressPercent}%`;

      optionsContainerEl.innerHTML = "";

      const optionLabels = ["A", "B", "C", "D"];

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<strong>${optionLabels[idx]}&nbsp;&nbsp;</strong> ${escapeHtml(opt)}`;
        btn.onclick = () => selectOption(idx);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (answered) return;
      answered = true;

      const qData = questions[currentQuestionIndex];
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === qData.answer) {
        buttons[selectedIndex].classList.add("correct");
        score++;
        scoreCounterEl.textContent = `Score: ${score}`;
      } else {
        buttons[selectedIndex].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById("quiz-screen").classList.add("hide");
      document.getElementById("summary-screen").classList.remove("hide");
      
      const scoreCircle = document.getElementById("final-score");
      scoreCircle.textContent = `${score} / ${questions.length}`;

      const feedback = document.getElementById("feedback-text");
      const percentage = (score / questions.length) * 100;

      if (percentage >= 85) {
        feedback.textContent = "Outstanding performance! You have fully mastered OOP and Software Engineering concepts.";
      } else if (percentage >= 70) {
        feedback.textContent = "Great job! You demonstrate a solid understanding of the principles.";
      } else if (percentage >= 50) {
        feedback.textContent = "Good effort! Review the notes on UML and testing to improve further.";
      } else {
        feedback.textContent = "Keep practicing! Re-read the chapters on OOP pillars and UML diagrams and try again.";
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById("summary-screen").classList.add("hide");
      document.getElementById("quiz-screen").classList.remove("hide");
      loadQuestion();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize Quiz
    loadQuestion();
  </script>
